name = "rtk-baselines"

# The one path the separate verifier collects from the agent's final container. A top-level key
# on purpose: Harbor ignores an artifacts list placed under [verifier].
artifacts = [
    "/app/rtk/",
]

[metadata]
author_name = "anonymous"
author_email = "anonymous"
category = "Science"
subcategory = "Earth"
tags = ["javascript", "gnss", "carrier-phase", "integer-ambiguity", "volcano-deformation", "tcp"]
languages = ["javascript"]
difficulty = "core"
expert_time_estimate_hours = 6
is_multi_container = true
difficulty_explanation = """
The agent writes a node program that turns one session of dual-frequency satellite code and carrier phase, streamed per station by the network's caster, into each rover's baseline to the reference station to within 30 mm per component. Carrier phase only reaches the mm level once the double-difference ambiguities are fixed to integers, and nothing in the task says so: the README describes the receivers, the clocks, the ionosphere and the frame, and the rest is the analyst's own geodetic model. Three things stand between a textbook reading and the right numbers. The ionospheric delay differs between the ends of every baseline by up to about 0.4 m, steady over the session, so it has to be carried as one parameter per satellite pair; set to zero, the fixed baselines miss by 3.9 m on the shipped session. The TARN-2 receivers lose lock without always raising the loss-of-lock bits, so arcs cut only on the bits leave two slipped satellites in the shipped session and throw two rovers metres out, the worse by 82 m; the slips have to be found in the phase itself. And the float ambiguities are strongly correlated on sessions this short, so rounding them (worst rover 195 mm) or sequential rounding with no reduction (379 mm) picks wrong integers, and the float baseline itself is 85 mm out.

The held-back session is from another volcano with 15 satellites in view, 26 to 30 ambiguities per rover and a 60 epoch session, against the shipped 8 satellites, 14 to 18 ambiguities and 90 epochs; the README states those ranges but never ships an instance that large. Integer least squares searched on the ambiguities as they come, with no LAMBDA reduction and with the L1 ambiguities of every arc ahead of the L2 ones as a float state vector is usually laid out, is exact and finishes the shipped session in 1.8 s (2 to 34 s over eight fresh seeds), but on the held-back session it is still searching when the run is killed at 120 s, on all nine held-back sessions tried, and one of those rovers, searched on its own with no limit, was still going when stopped after 30 minutes. The reduced search (LAMBDA) needs at most about 50,000 nodes per rover there, and the whole run takes about a second. Over eight fresh seeds of each network the reference's worst component error is 9.0 mm and 2.3 mm, against best wrong routes of 50 mm (float) and 86 mm, and the bar sits at 30 mm, the midpoint of that gap.

What makes it slow for an expert is that every one of these routes prints plausible baselines and nothing in the stream says which are right: recognising the ionosphere-float model the facts in the README imply, finding the slips that carry no flag from jumps in the geometry-free phase and the wide lane, building the double-difference normal equations with their pivot correlation by hand in plain JavaScript, and writing the integer reduction and search with no numeric library is the day-to-day craft of an analyst who processes a volcano's satellite geodesy network, not something a generic least-squares habit reaches.
"""
solution_explanation = """
The oracle, solve.sh, copies solution/main.js into /app/rtk and has node parse it. The program reads the station list, then subscribes to every station from cursor '-' and, each time the caster writes CUT, reconnects and carries on with that cursor, keeping epochs by number so a repeat is dropped. For each rover it cuts every station's satellite series into arcs where the receiver raised a loss-of-lock bit, where the geometry-free phase steps by more than 5 cm between epochs, or where the wide-lane combination of code and phase leaves its running mean by more than 4 cycles, and picks as pivot the highest satellite tracked unbroken at both ends all session. It forms double differences of both codes and both phases, weights each epoch's set with the inverse of its covariance (the shared pivot correlates them), and solves by Gauss-Newton for the baseline, one steady ionospheric offset per satellite pair (entering code and phase with opposite signs and (f1/f2)^2 on L2) and the L1 and L2 ambiguities of every arc. The float ambiguities and their covariance go to integer least squares: an LDL factorization, integer Gauss transforms and swaps until the conditional variances are ordered (the LAMBDA reduction), a depth-first search of the ellipsoid that shrinks to the best two candidates, and the transform undone. The baseline is then solved again with those integers held and printed as east, north and up at the reference monument on the WGS84 ellipsoid. solution/generate_network.py rebuilds both sessions and the true baselines byte for byte from the physical model written down in it.
"""
verification_explanation = """
Of the agent's box only /app/rtk reaches the grader. tests/test.sh copies only the regular .js, .mjs, .cjs and package.json files directly under /app/rtk into a root-owned directory and rebuilds /app/rtk from that copy, read-only to the unprivileged user, so links, subdirectories and node_modules never reach the run. It then starts its own caster twice from the copy in its image and runs `node main.js` against each from /app/rtk, with a clean environment, through a seccomp launcher (tests/launch.c) that refuses any further exec: the shipped session on 127.0.0.3 with a 23 epoch connection limit, and the held-back session on a host name with a 17 epoch limit. tests/test_outputs.py makes 7 checks: main.js was collected; each run printed one JSON object keyed by exactly that session's rovers with numeric east, north and up; every component is within 30 mm of the true baseline; the run finished inside 120 s of wall time (an exit status alone is not taken as a timeout); and the caster's own log shows every epoch of every station sent to the run, with CUTs in play.

The grader works nothing out for itself: the true baselines were written by solution/generate_network.py and are baked into the verifier image, root-only. The shipped session carries each case the task turns on: seven rovers, two TARN-2 slips with no bit raised (and three slips that do carry the bits), telemetry gaps early and late including one at the reference station, ionospheric offsets from a few cm to over 0.1 m, and float ambiguities that rounding gets wrong. Eleven variants of the reference registered in scripts/verify_arms.sh were run through this verifier with the compose stack: the reference scores 1, a report with no final newline and a program split over two files beside a symlink and a subdirectory score 1, and the float baseline, rounded ambiguities, sequential rounding with no reduction, integer search with no reduction (killed at 120 s on the held-back run, correct on the shipped one), slips cut on the bits only, no ionospheric parameters, a literal 127.0.0.1, reading only up to the first CUT and a frozen copy of the shipped answers all score 0.

The tests, the sessions, the true baselines, the caster and the log directory are closed to the unprivileged user and probed before the program runs; pytest runs by absolute path with -P, every file it opens is opened with O_NOFOLLOW, and only root writes the reward.
"""
relevant_experience = """
I have processed continuous satellite geodesy data on an active volcano for a monitoring observatory: short static and kinematic sessions from a small network of summit and flank stations against a reference on stable ground, mixed receiver generations on the same network, and the daily argument over whether a centimetre of uplift is the edifice moving or an ambiguity fixed to the wrong integer. The judgement this task turns on, which model the ionosphere needs at a few kilometres, whether a receiver's lock flag can be trusted, and why an integer search that works on a quiet day stalls on a dense sky, is the judgement that job needs.
"""

[verifier]
timeout_sec = 1800
environment_mode = "separate"
network_mode = "public"

[agent]
timeout_sec = 5400
network_mode = "public"

[environment]
network_mode = "public"
build_timeout_sec = 900
cpus = 2
memory_mb = 4096
storage_mb = 10240
